# Dependabot version-update configuration.
#
# Security alerts and security-update PRs are configured separately in the
# repository settings. This file only governs scheduled version-update PRs.
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A compromised crate is usually yanked within days, so waiting keeps it
    # from being pulled in automatically the moment it ships.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      include: scope
    groups:
      # kube requires an exact k8s-openapi minor, and k8s-openapi's build script
      # refuses to compile a copy of itself that has no v1_* feature enabled.
      # Bumped apart, either PR leaves two copies in the graph with the feature
      # on one of them, so neither can build. Listed first: a dependency joins
      # the first group it matches.
      kube:
        patterns:
          - kube
          - k8s-openapi
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # This is what keeps the build on a current Rust: the base stage pins an exact
  # rust:<version> image, so a new release arrives here as a reviewable PR whose
  # CI proves the compiler still builds us. CI reads its own toolchain out of
  # that same line, so this one bump moves everything.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # The actionlint the lint workflow runs, pinned in a dockerfile beside it
  # because dependabot cannot see an image named in a workflow. Kept apart from
  # the build above so bumping a lint tool reads as the CI change it is.
  - package-ecosystem: docker
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
