# cargo-about configuration -- https://embarkstudios.github.io/cargo-about/

# Every architecture a release ships: the graph differs per target.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "powerpc64le-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
]

# Neither leaves anything of itself in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
ignore-transitive-dependencies = false

# Not a policy gate -- that is deny.toml. This resolves a choice like
# "MIT OR Apache-2.0", and Apache-2.0 leads because it is what we are under.
accepted = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# Apache-2.0, and already shipped beside this as LICENSE.
private = { ignore = true }
